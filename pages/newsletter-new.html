  <style type="text/tailwindcss">
    @layer components {
      .glass-panel {

      .hero-overlay > * { position: relative; z-index: 1; }
      .hero-gradient-word {
        @apply text-transparent bg-clip-text;
        background-image: linear-gradient(to right, #b83d7a 0%, #9849a8 30%, #6b5fa8 65%, #4db8aa 100%);
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
        text-stroke: 1px rgba(255, 255, 255, 0.5);
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      }
      .bg-blur-image { position: fixed; inset: 0; z-index: -3; background: url('/assets/bg.jpg') center center / cover no-repeat; }

      }
      .blob { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.6; }
      .nav-item { position: relative; }
      .nav-item::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        display: block;
        width: 0;
        height: 2px;
        background: #cf3594;
        transition: width .3s;
        box-shadow: 0 0 10px #cf3594;
      }
      .nav-item:hover::after { width: 100%; }
      .glass-panel-rose {
        @apply backdrop-blur-[25px];

      }
      .newsletter-new-form .form-field::placeholder { color: rgba(255, 255, 255, 0.5); }
      .newsletter-new-form .form-submit-btn {

      }
      .newsletter-new-form .form-submit-btn:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(207, 53, 148, 0.5); }
