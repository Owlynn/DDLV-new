  <style type="text/tailwindcss">
    @layer components {
      .glass-panel {
        @apply backdrop-blur-[25px] bg-white/10 border border-white/20;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 2px 1px rgba(255, 255, 255, 0.15), 0 0 15px rgba(255, 255, 255, 0.05);
      }
      .hero-overlay > * { position: relative; z-index: 1; }
      .hero-gradient-word {
        @apply text-transparent bg-clip-text;
        background-image: linear-gradient(to right, #b83d7a 0%, #9849a8 30%, #6b5fa8 65%, #4db8aa 100%);
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
        text-stroke: 1px rgba(255, 255, 255, 0.5);
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      }
      .bg-blur-image { position: fixed; inset: 0; z-index: -3; background: url('/assets/bg.jpg') 65% 50% / cover no-repeat; }
      .bg-textured-art {
        background-color: rgba(30, 15, 50, 0.08);
        background-image:
          radial-gradient(ellipse 120% 100% at 0% 50%, rgba(255, 255, 255, 0.07) 0%, transparent 50%),
          radial-gradient(circle at 10% 20%, rgba(91, 42, 181, 0.35) 0%, transparent 55%),
          radial-gradient(circle at 90% 10%, rgba(207, 53, 148, 0.3) 0%, transparent 55%),
          radial-gradient(circle at 50% 50%, rgba(122, 106, 199, 0.28) 0%, transparent 60%);
        position: fixed; inset: 0; z-index: -2;
      }
      .blob { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.6; }
      .nav-item { position: relative; }
      .nav-item::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        display: block;
        width: 0;
        height: 2px;
        background: #cf3594;
        transition: width .3s;
        box-shadow: 0 0 10px #cf3594;
      }
      .nav-item:hover::after { width: 100%; }
      .glass-panel-rose {
        @apply backdrop-blur-[25px];
        background-image: linear-gradient(135deg, rgba(255, 252, 255, 0.28) 0%, rgba(255, 240, 248, 0.14) 45%, rgba(240, 235, 255, 0.22) 100%);
        border: none;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.28), inset 0 0 2px 1px rgba(255, 250, 252, 0.2), 0 0 15px rgba(255, 245, 250, 0.04);
      }
      .espace-eleve-form .form-field {
        @apply w-full rounded-xl border border-white/25 bg-white/10 px-4 py-3 text-white placeholder-white/50 focus:border-accent focus:bg-white/15 focus:ring-2 focus:ring-accent/30 focus:outline-none transition-all;
      }
      .espace-eleve-form .form-field::placeholder { color: rgba(255, 255, 255, 0.5); }
      .espace-eleve-form .form-submit-btn {
        @apply inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-semibold text-sm uppercase tracking-widest text-white bg-accent hover:bg-accent/90 border-0 cursor-pointer transition-all disabled:opacity-60 disabled:cursor-not-allowed w-full;
        box-shadow: 0 4px 14px rgba(207, 53, 148, 0.4);
      }
      .espace-eleve-form .form-submit-btn:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(207, 53, 148, 0.5); }

<body class="font-display text-white relative espace-eleve-page min-h-screen">
  <div class="bg-blur-image" aria-hidden="true"></div>
  <div class="bg-textured-art"></div>
  <div class="blob w-[600px] h-[600px] bg-primary top-[-10%] left-[-10%]"></div>
  <div class="blob w-[500px] h-[500px] bg-accent bottom-[-10%] right-[-5%]"></div>
  <div class="blob w-[400px] h-[400px] bg-primary-light top-[40%] right-[10%]"></div>
  <div class="blob w-[300px] h-[300px] bg-primary bottom-[20%] left-[20%]"></div>

  <div id="site-header"></div>
  <script>
    (function() {
      var el = document.getElementById('site-header');
      if (!el) return;
      fetch('/partials/header.html').then(function(r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function(html) {
          el.innerHTML = html;
          var toggle = el.querySelector('.header-nav-toggle');
          var panel = document.getElementById('header-nav');
          var iconMenu = el.querySelector('.icon-menu');
          var iconClose = el.querySelector('.icon-close');
          if (toggle && panel) {
            toggle.addEventListener('click', function() {
              var open = panel.classList.contains('nav-open');
              if (open) {
                panel.classList.remove('nav-open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Ouvrir le menu');
                if (iconMenu) iconMenu.classList.remove('hidden');
                if (iconClose) iconClose.classList.add('hidden');
                document.body.classList.remove('no-scroll');
              } else {
                panel.classList.add('nav-open');
                toggle.setAttribute('aria-expanded', 'true');
                toggle.setAttribute('aria-label', 'Fermer le menu');
                if (iconMenu) iconMenu.classList.add('hidden');
                if (iconClose) iconClose.classList.remove('hidden');
                document.body.classList.add('no-scroll');
              }
            });
            panel.querySelectorAll('a').forEach(function(link) {
              link.addEventListener('click', function() {
                panel.classList.remove('nav-open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Ouvrir le menu');
                if (iconMenu) iconMenu.classList.remove('hidden');
                if (iconClose) iconClose.classList.add('hidden');
                document.body.classList.remove('no-scroll');
              });
            });
          }
        })
        .catch(function() {});
    })();
  </script>

            <div>

            <div>

            <button type="submit" class="form-submit-btn mt-2">
              <span class="material-symbols-outlined text-xl">login</span>
              Se connecter

          </form>
        </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('espace-eleve-login');
      if (!form) return;
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        // Placeholder : à brancher sur votre backend d'authentification
        var email = form.querySelector('[name="email"]').value.trim();
        var password = form.querySelector('[name="password"]').value;
        if (!email || !password) {
          alert('Veuillez remplir l\'email et le mot de passe.');
          return;
        }
        alert('Connexion en cours de configuration. Cette page sera reliée à votre système d\'authentification.');
