<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <base href="/">
  <title>Administration – Donner de la Voix</title>
  <link rel="icon" type="image/png" href="/assets/logo-ddlv.png">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5b2ab5",
            "primary-light": "#7a6ac7",
            "accent": "#cf3594",
            "deep-bg": "#0d0218",
          },
          fontFamily: {
            "display": ["'Josefin Sans'", "sans-serif"],
            "sans": ["'Josefin Sans'", "sans-serif"]
          },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .sidebar-link {
        @apply flex items-center gap-3 w-full px-4 py-3 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 text-sm font-medium tracking-wide text-left;
      }
      .sidebar-link.active {
        @apply text-accent bg-accent/10;
        box-shadow: inset 0 0 0 1px rgba(207, 53, 148, 0.25);
      }
      .stat-card {
        @apply rounded-2xl p-6;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(20px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      }
      .admin-btn {
        @apply inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm uppercase tracking-widest text-white transition-all cursor-pointer border-0;
        background: #cf3594;
        box-shadow: 0 4px 14px rgba(207, 53, 148, 0.4);
      }
      .admin-btn:hover {
        background: rgba(207, 53, 148, 0.9);
        box-shadow: 0 6px 20px rgba(207, 53, 148, 0.5);
      }
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0d0218;
      color: #fff;
      font-family: 'Josefin Sans', sans-serif;
    }
    .admin-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 55% 65% at 10% 15%, rgba(91,42,181,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 90% 85%, rgba(207,53,148,0.13) 0%, transparent 55%);
    }
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    .admin-sidebar {
      width: 260px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      z-index: 40;
      background: linear-gradient(160deg,
        rgba(255,252,255,0.12) 0%,
        rgba(255,240,248,0.06) 50%,
        rgba(240,235,255,0.10) 100%);
      backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255,255,255,0.09);
    }
    .admin-main {
      margin-left: 260px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 0.875rem 2rem;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      background: rgba(13, 2, 24, 0.65);
    }
    .admin-body {
      padding: 2rem;
      flex: 1;
    }
    .sidebar-sep {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.75rem 0;
    }
    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(91,42,181,0.6), rgba(207,53,148,0.6));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: fadeUp 0.25s ease forwards; }

    /* Blog list item */
    .post-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 0.875rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.15s;
      cursor: pointer;
    }
    .post-row:hover { background: rgba(255,255,255,0.09); }
    .post-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge-published { background: rgba(77,184,170,0.2); color: #4db8aa; }
    .badge-draft     { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="admin-bg" aria-hidden="true"></div>

  <!-- Chargement auth -->
  <div id="auth-loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#0d0218;">
    <span class="material-symbols-outlined spin" style="font-size:36px;color:rgba(207,53,148,0.65);">autorenew</span>
  </div>

  <!-- Interface admin -->
  <div id="admin-app" style="display:none;" class="admin-layout">

    <!-- ─── Sidebar ─── -->
    <aside class="admin-sidebar">
      <div style="display:flex;flex-direction:column;height:100%;">

        <!-- Marque -->
        <div style="padding:0.25rem 0.5rem;margin-bottom:2rem;">
          <div style="font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;color:#cf3594;line-height:1;">DDLV</div>
          <div style="font-size:0.6rem;text-transform:uppercase;letter-spacing:0.18em;color:rgba(255,255,255,0.28);margin-top:0.2rem;">Administration</div>
        </div>

        <!-- Navigation -->
        <nav style="display:flex;flex-direction:column;gap:0.2rem;flex:1;">
          <button class="sidebar-link active" data-page="dashboard" onclick="showPage('dashboard',this)">
            <span class="material-symbols-outlined" style="font-size:19px;flex-shrink:0;">dashboard</span>
            Dashboard
          </button>
          <button class="sidebar-link" data-page="blog" onclick="showPage('blog',this)">
            <span class="material-symbols-outlined" style="font-size:19px;flex-shrink:0;">article</span>
            Blog
          </button>
        </nav>

        <!-- Utilisateur & déconnexion -->
        <div>
          <div class="sidebar-sep"></div>
          <div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem 0.75rem;">
            <div class="user-avatar">
              <span class="material-symbols-outlined" style="font-size:15px;color:rgba(255,255,255,0.85);">person</span>
            </div>
            <span id="user-email" style="font-size:0.7rem;color:rgba(255,255,255,0.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px;"></span>
          </div>
          <button class="sidebar-link" onclick="logout()"
            onmouseover="this.style.color='#fca5a5'" onmouseout="this.style.color=''"
            style="color:rgba(255,255,255,0.38);">
            <span class="material-symbols-outlined" style="font-size:19px;flex-shrink:0;">logout</span>
            Déconnexion
          </button>
        </div>
      </div>
    </aside>

    <!-- ─── Zone principale ─── -->
    <div class="admin-main">

      <!-- Barre du haut -->
      <div class="admin-topbar">
        <h1 id="page-title" style="font-size:1rem;font-weight:600;letter-spacing:0.03em;color:rgba(255,255,255,0.9);">Dashboard</h1>
      </div>

      <!-- Contenu des pages -->
      <div class="admin-body">

        <!-- ════════════════ DASHBOARD ════════════════ -->
        <div id="page-dashboard" class="page-enter">

          <div style="margin-bottom:2rem;">
            <h2 style="font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:0.3rem;">Bonjour !</h2>
            <p style="color:rgba(255,255,255,0.4);font-size:0.85rem;">Bienvenue dans l'espace d'administration Donner de la Voix.</p>
          </div>

          <!-- Stats -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;max-width:760px;margin-bottom:2.5rem;">
            <div class="stat-card">
              <div style="display:flex;align-items:center;gap:0.4rem;color:rgba(255,255,255,0.4);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.9rem;">
                <span class="material-symbols-outlined" style="font-size:15px;">article</span>
                Articles publiés
              </div>
              <div id="stat-articles" style="font-size:2.4rem;font-weight:700;line-height:1;color:#fff;">–</div>
            </div>
            <div class="stat-card">
              <div style="display:flex;align-items:center;gap:0.4rem;color:rgba(255,255,255,0.4);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.9rem;">
                <span class="material-symbols-outlined" style="font-size:15px;">edit_note</span>
                Brouillons
              </div>
              <div id="stat-drafts" style="font-size:2.4rem;font-weight:700;line-height:1;color:#fff;">–</div>
            </div>
            <div class="stat-card">
              <div style="display:flex;align-items:center;gap:0.4rem;color:rgba(255,255,255,0.4);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.9rem;">
                <span class="material-symbols-outlined" style="font-size:15px;">event</span>
                Ateliers
              </div>
              <div style="font-size:2.4rem;font-weight:700;line-height:1;color:#fff;">–</div>
              <div style="font-size:0.68rem;color:rgba(255,255,255,0.28);margin-top:0.3rem;">Via BilletWeb</div>
            </div>
          </div>

          <!-- Accès rapides -->
          <div>
            <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.3);margin-bottom:0.75rem;">Accès rapides</div>
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
              <button class="admin-btn" onclick="showPage('blog', document.querySelector('[data-page=blog]'))">
                <span class="material-symbols-outlined" style="font-size:17px;">add</span>
                Nouvel article
              </button>
              <a href="/" target="_blank"
                style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.625rem 1.25rem;border-radius:0.75rem;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.65);background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);text-decoration:none;transition:background 0.15s;"
                onmouseover="this.style.background='rgba(255,255,255,0.12)'"
                onmouseout="this.style.background='rgba(255,255,255,0.07)'">
                <span class="material-symbols-outlined" style="font-size:17px;">open_in_new</span>
                Voir le site
              </a>
            </div>
          </div>
        </div>

        <!-- ════════════════ BLOG ════════════════ -->
        <div id="page-blog" style="display:none;" class="page-enter">

          <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;">
            <div>
              <h2 style="font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:0.3rem;">Articles</h2>
              <p style="color:rgba(255,255,255,0.4);font-size:0.85rem;">Gérez les articles du blog.</p>
            </div>
            <button class="admin-btn" onclick="openNewPost()">
              <span class="material-symbols-outlined" style="font-size:17px;">add</span>
              Nouvel article
            </button>
          </div>

          <!-- Liste ou état vide -->
          <div id="blog-list"></div>
        </div>

      </div><!-- /admin-body -->
    </div><!-- /admin-main -->
  </div><!-- /admin-app -->

  <!-- Supabase -->
  <script src="/supabase-config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    var sbClient = null;
    var currentPage = 'dashboard';
    var pageTitles = { dashboard: 'Dashboard', blog: 'Blog' };

    /* ── Init & vérif auth ─────────────────────────── */
    (async function init() {
      sbClient = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.key);

      const { data: { session } } = await sbClient.auth.getSession();
      if (!session) { window.location.href = '/espace-eleve'; return; }

      document.getElementById('user-email').textContent = session.user.email;
      document.getElementById('auth-loading').style.display = 'none';
      document.getElementById('admin-app').style.display = '';

      loadDashboardStats();
    })();

    /* ── Navigation ────────────────────────────────── */
    function showPage(name, btn) {
      document.querySelectorAll('[id^="page-"]').forEach(function(el) {
        el.style.display = 'none';
        el.classList.remove('page-enter');
      });
      var page = document.getElementById('page-' + name);
      page.style.display = '';
      void page.offsetWidth;
      page.classList.add('page-enter');

      document.querySelectorAll('.sidebar-link').forEach(function(el) { el.classList.remove('active'); });
      btn.classList.add('active');

      document.getElementById('page-title').textContent = pageTitles[name] || name;
      currentPage = name;

      if (name === 'blog') loadBlogPosts();
    }

    /* ── Dashboard stats ───────────────────────────── */
    async function loadDashboardStats() {
      try {
        var pub = await sbClient.from('posts').select('*', { count: 'exact', head: true }).eq('status', 'published');
        var draft = await sbClient.from('posts').select('*', { count: 'exact', head: true }).eq('status', 'draft');
        document.getElementById('stat-articles').textContent = pub.count ?? 0;
        document.getElementById('stat-drafts').textContent   = draft.count ?? 0;
      } catch (e) { /* table pas encore créée */ }
    }

    /* ── Blog : liste des articles ─────────────────── */
    async function loadBlogPosts() {
      var container = document.getElementById('blog-list');
      container.innerHTML = '<p style="color:rgba(255,255,255,0.35);font-size:0.85rem;padding:1rem 0;">Chargement…</p>';

      try {
        var { data: posts, error } = await sbClient
          .from('posts')
          .select('id, title, status, created_at')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!posts || posts.length === 0) {
          container.innerHTML = renderEmptyState();
          return;
        }

        container.innerHTML = '<div style="display:flex;flex-direction:column;gap:0.5rem;">'
          + posts.map(renderPostRow).join('')
          + '</div>';
      } catch (e) {
        container.innerHTML = renderEmptyState();
      }
    }

    function renderPostRow(post) {
      var date = new Date(post.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
      var badgeClass = post.status === 'published' ? 'badge-published' : 'badge-draft';
      var badgeLabel = post.status === 'published' ? 'Publié' : 'Brouillon';
      return '<div class="post-row">'
        + '<span class="material-symbols-outlined" style="font-size:18px;color:rgba(255,255,255,0.3);flex-shrink:0;">article</span>'
        + '<span style="flex:1;font-size:0.9rem;font-weight:500;color:rgba(255,255,255,0.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(post.title) + '</span>'
        + '<span class="post-badge ' + badgeClass + '">' + badgeLabel + '</span>'
        + '<span style="font-size:0.72rem;color:rgba(255,255,255,0.3);white-space:nowrap;flex-shrink:0;">' + date + '</span>'
        + '<span class="material-symbols-outlined" style="font-size:18px;color:rgba(255,255,255,0.25);flex-shrink:0;">chevron_right</span>'
        + '</div>';
    }

    function renderEmptyState() {
      return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:1rem;">'
        + '<span class="material-symbols-outlined" style="font-size:3rem;color:rgba(255,255,255,0.18);margin-bottom:1rem;">article</span>'
        + '<p style="color:rgba(255,255,255,0.35);font-size:0.9rem;margin-bottom:0.3rem;">Aucun article pour le moment.</p>'
        + '<p style="color:rgba(255,255,255,0.22);font-size:0.75rem;">Créez votre premier article pour commencer.</p>'
        + '</div>';
    }

    function openNewPost() {
      // À implémenter : formulaire / éditeur d'article
      alert('Éditeur d\'articles à venir.');
    }

    /* ── Déconnexion ───────────────────────────────── */
    async function logout() {
      await sbClient.auth.signOut();
      window.location.href = '/espace-eleve';
    }

    /* ── Utilitaires ───────────────────────────────── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Exposer sur window pour les onclick= dans le HTML (nécessaire avec type="module")
    window.showPage = showPage;
    window.logout = logout;
    window.openNewPost = openNewPost;
  </script>
</body>
</html>
