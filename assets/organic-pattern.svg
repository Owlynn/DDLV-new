<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="organicPattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <!-- Formes organiques fluides -->
      
      <!-- Formes principales - courbes douces -->
      <path d="M 50 80 Q 80 50, 120 70 Q 160 90, 180 60 Q 200 30, 230 50 Q 260 70, 280 40" 
            fill="none" 
            stroke="#5b2ab5" 
            stroke-width="2" 
            opacity="0.25"/>
      
      <path d="M 30 150 Q 60 120, 100 140 Q 140 160, 170 130 Q 200 100, 240 120 Q 270 140, 290 110" 
            fill="none" 
            stroke="#fe66c3" 
            stroke-width="2" 
            opacity="0.22"/>
      
      <path d="M 20 220 Q 50 190, 90 210 Q 130 230, 160 200 Q 190 170, 230 190 Q 260 210, 280 180" 
            fill="none" 
            stroke="#5b2ab5" 
            stroke-width="2" 
            opacity="0.25"/>
      
      <!-- Formes arrondies organiques -->
      <ellipse cx="80" cy="100" rx="25" ry="18" 
               fill="#5b2ab5" 
               opacity="0.2" 
               transform="rotate(-15 80 100)"/>
      
      <ellipse cx="200" cy="90" rx="20" ry="25" 
               fill="#fe66c3" 
               opacity="0.18" 
               transform="rotate(20 200 90)"/>
      
      <ellipse cx="150" cy="170" rx="22" ry="20" 
               fill="#5b2ab5" 
               opacity="0.2" 
               transform="rotate(-10 150 170)"/>
      
      <ellipse cx="70" cy="200" rx="18" ry="22" 
               fill="#fe66c3" 
               opacity="0.18" 
               transform="rotate(25 70 200)"/>
      
      <ellipse cx="220" cy="190" rx="24" ry="19" 
               fill="#5b2ab5" 
               opacity="0.2" 
               transform="rotate(-20 220 190)"/>
      
      <!-- Petites formes pour texture -->
      <circle cx="40" cy="60" r="8" fill="#fe66c3" opacity="0.25"/>
      <circle cx="250" cy="70" r="7" fill="#5b2ab5" opacity="0.25"/>
      <circle cx="60" cy="250" r="9" fill="#fe66c3" opacity="0.25"/>
      <circle cx="240" cy="240" r="8" fill="#5b2ab5" opacity="0.25"/>
      <circle cx="130" cy="50" r="6" fill="#fe66c3" opacity="0.25"/>
      <circle cx="170" cy="250" r="7" fill="#5b2ab5" opacity="0.25"/>
      
      <!-- Formes en goutte -->
      <path d="M 120 120 Q 130 110, 140 120 Q 130 130, 120 120" 
            fill="#fe66c3" 
            opacity="0.2"/>
      
      <path d="M 180 160 Q 190 150, 200 160 Q 190 170, 180 160" 
            fill="#5b2ab5" 
            opacity="0.2"/>
      
      <path d="M 100 230 Q 110 220, 120 230 Q 110 240, 100 230" 
            fill="#fe66c3" 
            opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#organicPattern)"/>
</svg>








